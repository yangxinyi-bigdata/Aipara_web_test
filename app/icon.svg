<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Duanluo 段落输入法 favicon：段落符 ¶ × 输入光标。矢量源见管理端仓库 docs/design/logo/。 -->
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22.5" fill="url(#dl-bg)"/>
  <!-- 16 px 光学微调版几何：杆加粗、间隙加大，标签页尺寸下才不糊。 -->
  <g fill="#FFFFFF" transform="translate(25.7 21) scale(0.69)">
    <circle cx="36" cy="32" r="24"/>
    <rect x="36" y="8" width="24" height="48"/>
    <rect x="44" y="8" width="16" height="84"/>
    <rect x="72" y="8" width="16" height="84" rx="8"/>
  </g>
</svg>
